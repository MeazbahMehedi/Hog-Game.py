name: Native builds (manual validation artifacts)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux display support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install -r requirements-build.txt
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
      - run: python -m doctest hog.py dice.py
      - run: python tools/network_smoke.py
      - run: python tools/build_desktop.py
      - name: Native window smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/Hog/Hog --smoke-test
      - name: Native window smoke (Windows)
        if: runner.os == 'Windows'
        run: |
          $process = Start-Process -FilePath dist/Hog/Hog.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Native window smoke (macOS)
        if: runner.os == 'macOS'
        run: dist/Hog.app/Contents/MacOS/Hog --smoke-test
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw "ISCC.exe was not found after installation" }
          & $compiler.FullName installers/windows/Hog.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: python tools/build_macos_dmg.py
      - uses: actions/upload-artifact@v4
        with:
          name: Hog-${{ matrix.os }}-review-before-publishing
          path: |
            dist/
            dist-installers/
